<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>River Flow Israel — streamflow in Israel's rivers and wadis</title>
<meta name="description" content="Live modelled streamflow for Israel's rivers and wadis, with the Israel Hydrological Service gauging network and the points where water crosses Israel's borders.">
<style>/*LEAFLET_CSS*/</style>
<style>
:root{
  --surface-0:#0d0f11; --surface-1:#14181c; --surface-2:#1b2126;
  --line:#2a3238;
  --ink-1:#f2f5f7; --ink-2:#a8b4bd; --ink-3:#6e7c86;
  --q0:#184f95; --q1:#256abf; --q2:#3987e5; --q3:#6da7ec; --q4:#9ec5f4; --q5:#cde2fb;
  --unknown:#49555e;
  --accent:#ffd24a;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --pad:14px;
  --font:"Inter","Helvetica Neue",Arial,"Noto Sans Hebrew","Arial Hebrew",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--surface-0);color:var(--ink-1);
  font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
#map{position:absolute;inset:0;background:var(--surface-0)}
.leaflet-container{background:var(--surface-0);font-family:var(--font)}
canvas.riv{position:absolute;pointer-events:none}

/* ---------- chrome ---------- */
.panel{position:absolute;z-index:750;background:rgba(13,15,17,.86);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:10px}
#head{top:14px;inset-inline-start:14px;width:308px;padding:16px 18px 14px}
#head .kicker{font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--q3);font-weight:600;display:flex;align-items:center;gap:7px}
#head .kicker .dot{width:6px;height:6px;border-radius:50%;background:var(--q3);
  box-shadow:0 0 0 0 rgba(109,167,236,.7);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(109,167,236,.55)}70%{box-shadow:0 0 0 9px rgba(109,167,236,0)}100%{box-shadow:0 0 0 0 rgba(109,167,236,0)}}
#head h1{margin:9px 0 6px;font-size:25px;line-height:1.08;letter-spacing:-.02em;font-weight:650}
#head p{margin:0;font-size:12.5px;line-height:1.45;color:var(--ink-2)}
#stat{margin-top:11px;padding-top:10px;border-top:1px solid var(--line);
  font-size:11px;color:var(--ink-3);line-height:1.5}
#stat b{color:var(--ink-2);font-weight:600;font-variant-numeric:tabular-nums}
#headfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:11px}
#headfoot .seg{flex:1;max-width:170px}
#headfoot .lnk{white-space:nowrap}

/* The controls and the detail panel share the right-hand column: the controls
   hang from the top, the panel sits on the bottom and grows upward. Splitting
   the height between them keeps them from ever meeting, however many rows the
   evidence section adds. */
#ctl{top:14px;inset-inline-end:14px;width:252px;padding:14px 16px 15px;
  max-height:calc(50vh - 60px);overflow:auto}
@media (max-height:760px){#ctl{max-height:calc(50vh - 40px)}}
.sect{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;margin:0 0 9px}
.sect+.sect,.row+.sect,.grp+.sect{margin-top:17px}
/* Layer groups. Twelve flat checkboxes is a list; four named groups is a menu. */
.grp{margin:0 0 4px}
.ghead{display:flex;align-items:center;gap:7px;width:100%;background:none;border:0;
  color:var(--ink-2);font-family:var(--font);font-size:11.5px;font-weight:600;
  padding:5px 0;cursor:pointer;text-align:start}
.ghead:hover{color:var(--ink-1)}
.gcar{color:var(--ink-3);font-size:9px;width:9px;display:inline-block;transition:.15s}
.gbody{display:none;padding:2px 0 6px 4px}
.grp.open .gbody{display:block}
.grp.open .gcar{color:var(--q3)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 9px;font-size:12px;color:var(--ink-2)}
.row label{cursor:pointer;display:flex;align-items:center;gap:8px;flex:1}
.sw{width:15px;height:15px;flex:none;border:1.5px solid #3b464e;border-radius:4px;
  display:grid;place-items:center;transition:.14s}
.sw.on{background:var(--q2);border-color:var(--q2)}
.sw svg{width:9px;height:9px;opacity:0;transition:.14s}
.sw.on svg{opacity:1}
.gly{width:16px;text-align:center;color:var(--ink-3);font-size:11px;flex:none}
input[type=range]{-webkit-appearance:none;appearance:none;width:104px;height:3px;
  background:var(--line);border-radius:2px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;
  border-radius:50%;background:var(--q3);cursor:pointer;border:0}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;
  background:var(--q3);cursor:pointer;border:0}
.val{font-size:11px;color:var(--ink-2);text-align:end;font-variant-numeric:tabular-nums;
  direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.ctlrow{margin:0 0 12px}
.ctlrow .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  font-size:12px;color:var(--ink-2);margin-bottom:6px}
.ctlrow input[type=range]{width:100%}
select,input[type=search]{width:100%;background:var(--surface-2);color:var(--ink-1);
  border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:12px;
  font-family:var(--font);outline:none}
select:focus,input[type=search]:focus{border-color:var(--q2)}
.btn{background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);
  border-radius:7px;padding:7px 10px;font-size:11.5px;cursor:pointer;font-family:var(--font)}
.btn:hover{border-color:var(--q2);color:var(--ink-1)}
.btn.on{background:var(--q0);border-color:var(--q2);color:var(--ink-1)}
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{flex:1;background:transparent;border:0;color:var(--ink-3);padding:6px 0;
  font-size:11.5px;cursor:pointer;font-family:var(--font)}
.seg button.on{background:var(--q0);color:var(--ink-1)}
/* a popover at body level — inside #ctl its overflow:auto would clip it */
#basemenu{display:none;top:70px;inset-inline-end:276px;width:236px;padding:13px 14px 10px}
#basemenu.open{display:block}
@media (max-width:980px){
  #basemenu{top:auto;bottom:14px;inset-inline-end:14px;width:236px}
}
.bopt{display:flex;align-items:center;gap:9px;width:100%;background:var(--surface-2);
  border:1px solid var(--line);border-radius:7px;padding:7px 9px;margin-bottom:5px;
  cursor:pointer;font-size:12px;color:var(--ink-2);font-family:var(--font);text-align:start}
.bopt:hover{border-color:var(--q2);color:var(--ink-1)}
.bopt.on{border-color:var(--q3);background:var(--q0);color:var(--ink-1)}
.bswatch{width:22px;height:22px;border-radius:5px;flex:none;border:1px solid rgba(255,255,255,.14)}
#basehint{font-size:10.5px;line-height:1.45;color:var(--ink-3);margin:2px 0 4px}

/* ---------- legend ---------- */
#leg{bottom:14px;inset-inline-start:14px;width:308px;padding:13px 16px 14px}
.lgrid{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;align-items:center;margin-bottom:9px}
.lswatch{width:34px;height:5px;border-radius:3px}
.lgrid span{font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums}
#leg .note{font-size:10.5px;line-height:1.5;color:var(--ink-3);margin:0}

/* ---------- detail ---------- */
#info{bottom:30px;inset-inline-end:14px;width:288px;padding:15px 17px;display:none;
  max-height:calc(50vh - 40px);overflow-y:auto}
#info.show{display:block}
#info h3{margin:0 0 2px;font-size:16px;font-weight:640;letter-spacing:-.01em}
#info .sub{font-size:11px;color:var(--ink-3);margin-bottom:11px}
#info .big{font-size:29px;font-weight:660;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
#info .big small{font-size:12px;font-weight:500;color:var(--ink-3);margin-inline-start:5px;letter-spacing:0}
#info dl{margin:11px 0 0;display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:11.5px}
#info dt{color:var(--ink-3)}
#info dd{margin:0;color:var(--ink-2);text-align:end;font-variant-numeric:tabular-nums;line-height:1.45}
bdi{unicode-bidi:isolate}
.val,#info dd,.lgrid span,#stat b{unicode-bidi:isolate}
#info .close{position:absolute;top:10px;inset-inline-end:11px;cursor:pointer;color:var(--ink-3);
  font-size:16px;line-height:1;background:none;border:0}
#spark{width:100%;height:44px;display:block;margin-top:11px}
.pill{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;
  font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.pill.model{background:rgba(57,135,229,.16);color:var(--q3)}
.pill.meas{background:rgba(12,163,12,.16);color:#3ec93e}
.pill.src{background:rgba(255,210,74,.14);color:var(--accent)}
.pill.samp{background:rgba(62,201,62,.16);color:#3ec93e}
.pill.cross{background:rgba(250,178,25,.16);color:#fab219}
.pill.ok{background:rgba(62,201,62,.16);color:#3ec93e}
.pill.dry{background:rgba(168,138,74,.18);color:#c8a75d}
.pill.unver{background:rgba(171,119,205,.20);color:#c295e0}
.pill.none{background:rgba(93,106,115,.22);color:#93a1ab}
body[data-surf="light"] .pill.dry{background:rgba(125,100,40,.14);color:#6a5522}
body[data-surf="light"] .pill.unver{background:rgba(143,63,190,.14);color:#7a35a2}
body[data-surf="light"] .pill.none{background:rgba(114,128,134,.18);color:#5b666c}
.vr{display:inline-block;margin-inline-start:6px;padding:1px 6px;border-radius:20px;
    font-size:10px;font-weight:700;letter-spacing:.03em}
.vr.ok{background:rgba(62,201,62,.16);color:#3ec93e}
.vr.mid{background:rgba(250,178,25,.16);color:#fab219}
.vr.off{background:rgba(208,59,59,.18);color:#f07777}
#trace{position:fixed;inset:0;z-index:1000;background:rgba(6,8,10,.72);
  backdrop-filter:blur(3px);display:none;overflow:auto;padding:34px 18px}
#trace.show{display:block}
#trace .card{max-width:760px;margin:0 auto;background:var(--surface-1);
  border:1px solid var(--line);border-radius:12px;padding:26px 28px;position:relative}
#trtable{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:12px}
#trtable th{text-align:start;color:var(--ink-3);font-weight:600;padding:5px 6px;
  border-bottom:1px solid var(--line);white-space:nowrap}
#trtable td{padding:5px 6px;border-bottom:1px solid var(--line);
  font-variant-numeric:tabular-nums;color:var(--ink-2)}
#trtable tr.gap td{border-bottom:2px dashed var(--warning)}
#trtable .st{font-weight:700}
#trhead{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:14px 0}
#trhead div{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
#trhead b{display:block;font-size:19px;line-height:1.2}
#trhead span{font-size:10.5px;color:var(--ink-3)}
#vertable{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px}
#vertable td{padding:5px 8px;border-bottom:1px solid var(--line)}
#vertable td:last-child{text-align:end;font-variant-numeric:tabular-nums;font-weight:600}
#verbox .num{font-size:26px;font-weight:700;line-height:1.1}
#verbox .lede{color:var(--ink-2);font-size:13px}
#verbar{height:4px;border-radius:3px;background:var(--line);overflow:hidden;margin:8px 0}
#verbar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}

/* ---------- tooltip ---------- */
#banner{position:absolute;z-index:760;bottom:14px;left:50%;transform:translateX(-50%);
  max-width:min(460px,90vw);text-align:center}
#banner .lnk{margin-inline-start:4px}
@media (max-width:860px){#banner{bottom:auto;top:96px}}
#tip{position:absolute;z-index:900;pointer-events:none;background:rgba(13,15,17,.94);
  border:1px solid var(--line);border-radius:7px;padding:7px 10px;font-size:12px;
  display:none;max-width:230px;line-height:1.35}
#tip .q{color:var(--q4);font-variant-numeric:tabular-nums;font-weight:600}
#tip .m{color:var(--ink-3);font-size:10.5px}

/* ---------- boot ---------- */
#boot{position:absolute;inset:0;z-index:1400;background:var(--surface-0);
  display:grid;place-items:center;text-align:center;padding:26px}
#boot.done{opacity:0;pointer-events:none;transition:opacity .5s .1s}
#boot .in{max-width:420px}
#boot h2{font-size:22px;margin:0 0 8px;font-weight:640;letter-spacing:-.02em}
#boot p{color:var(--ink-2);font-size:13px;line-height:1.55;margin:0 0 20px}
#bar{height:3px;background:var(--surface-2);border-radius:2px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--q3);transition:width .4s}
#bmsg{margin-top:11px;font-size:11.5px;color:var(--ink-3);min-height:16px}
.wave{display:flex;gap:4px;justify-content:center;margin-bottom:20px}
.wave i{width:3px;height:20px;background:var(--q2);border-radius:2px;animation:w 1.1s infinite ease-in-out}
.wave i:nth-child(2){animation-delay:.1s;background:var(--q3)}
.wave i:nth-child(3){animation-delay:.2s;background:var(--q4)}
.wave i:nth-child(4){animation-delay:.3s;background:var(--q3)}
.wave i:nth-child(5){animation-delay:.4s;background:var(--q2)}
@keyframes w{0%,100%{transform:scaleY(.4);opacity:.5}50%{transform:scaleY(1.5);opacity:1}}

/* ---------- about ---------- */
#about{position:absolute;inset:0;z-index:1300;background:rgba(6,8,9,.9);
  backdrop-filter:blur(6px);display:none;overflow:auto;padding:40px 20px}
#about.show{display:block}
#about .card{max-width:660px;margin:0 auto;background:var(--surface-1);
  border:1px solid var(--line);border-radius:12px;padding:28px 32px 32px;position:relative}
#about h2{margin:0 0 4px;font-size:21px;letter-spacing:-.02em}
#about h4{margin:20px 0 7px;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--q3)}
#about p,#about li{font-size:13px;line-height:1.62;color:var(--ink-2);margin:0 0 8px}
#about ul{margin:0;padding-inline-start:19px}
#about a{color:var(--q4)}
#about .close{position:absolute;top:14px;inset-inline-end:16px;background:none;border:0;
  color:var(--ink-3);font-size:20px;cursor:pointer;line-height:1}
.warn{background:rgba(250,178,25,.09);border:1px solid rgba(250,178,25,.3);
  border-radius:8px;padding:11px 13px;margin:12px 0}
.warn p{margin:0;color:#f4d69a;font-size:12.5px}

.lnk{background:none;border:0;color:var(--q4);font-size:11px;cursor:pointer;
  padding:0;font-family:var(--font);text-decoration:underline;text-underline-offset:2px}
/* Attribution is a licence condition of OSM, CARTO, Esri and OpenTopoMap, so it
   stays — but it is folded down to a single glyph until you touch it. */
.leaflet-control-attribution{background:rgba(13,15,17,.72)!important;color:transparent!important;
  font-size:0!important;direction:ltr;white-space:nowrap;border-radius:5px 0 0 0;
  padding:2px 6px!important;transition:font-size .15s ease}
.leaflet-control-attribution a{color:transparent!important}
.leaflet-control-attribution:before{content:"\24D8";font-size:11px;color:var(--ink-2)}
.leaflet-control-attribution:hover,.leaflet-control-attribution:focus-within{
  font-size:9.5px!important;color:var(--ink-3)!important}
.leaflet-control-attribution:hover a,.leaflet-control-attribution:focus-within a{color:var(--ink-2)!important}
.leaflet-control-attribution a{color:var(--ink-2)!important}
.leaflet-bar a{background:rgba(13,15,17,.86)!important;color:var(--ink-1)!important;border-color:var(--line)!important}
/* keep the zoom buttons under the header panel in both writing directions */
.leaflet-top.leaflet-left{left:auto;right:auto;inset-inline-start:2px;margin-top:214px}
@media (max-width:860px){.leaflet-top.leaflet-left{margin-top:88px}}
[dir=rtl] #head h1,[dir=rtl] #about h2{letter-spacing:0}
@media (max-width:860px){
  #head{width:auto;inset-inline-end:14px}
  #head h1{font-size:20px} #head p{display:none}
  #ctl{top:auto;bottom:14px;inset-inline-end:14px;width:214px;max-height:52%}
  #leg{display:none} #info{bottom:14px;inset-inline-start:14px;inset-inline-end:auto;width:230px}
}
</style>
</head>
<body>
<div id="map"></div>
<div id="tip"></div>
